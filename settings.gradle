pluginManagement {
    repositories {
        google()
        maven { url = uri('https://maven-central.storage-download.googleapis.com/maven2/') }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        maven { url = uri('https://maven-central.storage-download.googleapis.com/maven2/') }
        mavenCentral()
    }
}
rootProject.name = 'PocketStudio'
include ':app'
include ':aosp-ddmlib'
project(':aosp-ddmlib').projectDir = file('upstream')
include ':plugin-api', ':agent-api', ':codex-plugin', ':codex-plugin-apk'
project(':codex-plugin').projectDir = file('plugins/codex')
project(':codex-plugin-apk').projectDir = file('plugins/codex/apk')
include ':android-plugin'
project(':android-plugin').projectDir = file('plugins/android')
include ':linux-avf-plugin', ':linux-proot-plugin'
project(':linux-avf-plugin').projectDir = file('plugins/avf')
project(':linux-proot-plugin').projectDir = file('plugins/proot')
