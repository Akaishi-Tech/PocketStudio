// Package the notices from the same sources used to build the APK.
abstract class PrepareLicenseAssets extends DefaultTask {
    @InputFile abstract RegularFileProperty getProjectLicense()
    @InputFile abstract RegularFileProperty getDdmlibNotice()
    @InputFile abstract RegularFileProperty getAnnotationsNotice()
    @OutputDirectory abstract DirectoryProperty getOutputDirectory()

    @TaskAction
    void generate() {
        def notices = outputDirectory.dir('licenses').get().asFile
        notices.mkdirs()
        ['PocketStudio.txt': projectLicense, 'AOSP-tools.txt': ddmlibNotice,
         'AOSP-annotations.txt': annotationsNotice].each { name, source ->
            new File(notices, name).bytes = source.get().asFile.bytes
        }
    }
}

def root = rootProject.layout.projectDirectory
androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    def notices = tasks.register("prepare${variant.name.capitalize()}LicenseAssets", PrepareLicenseAssets) {
        projectLicense.set(root.file('LICENSE'))
        ddmlibNotice.set(root.file('upstream/release/tools/base/ddmlib/NOTICE'))
        annotationsNotice.set(root.file('upstream/release/tools/base/annotations/NOTICE'))
    }
    variant.sources.assets.addGeneratedSourceDirectory(notices) { it.outputDirectory }
}
