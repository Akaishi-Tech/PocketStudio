plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def signingFile = providers.environmentVariable('ANDROID_KEYSTORE_PATH').orNull
def distributionVersion = providers.environmentVariable('POCKETSTUDIO_VERSION_NAME')
        .orElse(providers.gradleProperty('pocketStudioBaseVersion')).get()
def distributionCode = providers.environmentVariable('POCKETSTUDIO_VERSION_CODE')
        .orElse(providers.gradleProperty('pocketStudioBaseVersionCode')).get().toInteger()
if (!(distributionVersion ==~ /\d+\.\d+\.\d+/) || distributionCode < 1 || distributionCode > 2100000000) {
    throw new GradleException('Invalid Pocket Studio release version')
}

android {
    namespace 'com.hcgstudio.pocketstudio'
    compileSdk { version = release(37) }
    defaultConfig {
        applicationId 'com.hcgstudio.pocketstudio'
        minSdk 26
        targetSdk 35
        testInstrumentationRunner 'com.hcgstudio.pocketstudio.testing.DeviceDebugTest'
        versionCode distributionCode
        versionName distributionVersion
    }
    flavorDimensions += 'architecture'
    [arm64V8a: 'arm64-v8a', armeabiV7a: 'armeabi-v7a', x86: 'x86', x86_64: 'x86_64'].each { flavor, abi ->
        productFlavors.create(flavor) {
            dimension 'architecture'
            ndk.abiFilters.add(abi)
        }
        sourceSets.getByName(flavor).assets.srcDir("../build-support/abi-assets/${abi}")
    }
    if (signingFile != null) {
        signingConfigs {
            distribution {
                storeFile rootProject.file(signingFile)
                storePassword providers.environmentVariable('ANDROID_KEYSTORE_PASSWORD').get()
                keyAlias providers.environmentVariable('ANDROID_KEY_ALIAS').get()
                keyPassword providers.environmentVariable('ANDROID_KEY_PASSWORD').get()
            }
        }
        buildTypes.release.signingConfig = signingConfigs.distribution
    }
    buildFeatures { compose = true; buildConfig = true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.java.srcDir '../upstream/portable'
}
apply from: 'embedded.gradle'
apply from: 'licenses.gradle'

dependencies {
    implementation project(":agent-api")
    androidTestImplementation(testFixtures(project(":codex-plugin")))
    implementation project(':aosp-ddmlib')
    implementation 'org.commonmark:commonmark:0.32.0'
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.32.0'
    implementation 'org.commonmark:commonmark-ext-gfm-strikethrough:0.32.0'
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'com.github.javaparser:javaparser-symbol-solver-core:3.27.1'
}
