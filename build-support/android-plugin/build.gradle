plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.hcgstudio.pocketstudio.androidplugin'
    compileSdk { version = release(37) }
    defaultConfig {
        applicationId 'com.hcgstudio.pocketstudio.androidplugin'
        minSdk 26
        targetSdk 35
        versionCode providers.environmentVariable('POCKETSTUDIO_VERSION_CODE').orElse(providers.gradleProperty('pluginVersionCode')).orElse('1').get().toInteger()
        versionName providers.environmentVariable('POCKETSTUDIO_VERSION_NAME').orElse(providers.gradleProperty('pluginVersionName')).orElse('1.0.0').get()
    }
    flavorDimensions += 'architecture'
    [arm64V8a: 'arm64-v8a', armeabiV7a: 'armeabi-v7a', x86: 'x86', x86_64: 'x86_64'].each { flavor, abi ->
        productFlavors.create(flavor) {
            dimension 'architecture'
            ndk.abiFilters.add(abi)
        }
        sourceSets.getByName(flavor).assets.srcDir("../abi-assets/${abi}")
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/libaapt2.so', '**/libstudio_jdk_*.so']
        }
        resources.pickFirsts += ['about.html', 'plugin.properties']
    }
    buildFeatures { compose = true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

apply from: rootProject.file('build-support/release-signing.gradle')
apply from: 'jdk-license.gradle'

dependencies {
    compileOnly project(':plugin-api')
    compileOnly platform('androidx.compose:compose-bom:2026.09.00')
    compileOnly 'androidx.compose.material3:material3'
    compileOnly 'androidx.activity:activity-compose:1.13.0'
    implementation 'com.davidehrmann.vcdiff:vcdiff-core:0.2.0'
    implementation 'org.eclipse.jdt.core.compiler:ecj:4.6.1'
    implementation 'com.jakewharton.android.repackaged:dalvik-dx:14.0.0_r21'
    implementation 'com.android.tools.build:apksig:9.2.0'
}
