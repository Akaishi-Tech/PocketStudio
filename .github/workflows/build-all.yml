name: Build all Pocket Studio plugins
on: workflow_dispatch
concurrency:
  group: signed-plugin-builds
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  plugins:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        plugin: [android, codex]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-plugin
        with:
          plugin: ${{ matrix.plugin }}
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
  image:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    strategy:
      fail-fast: false
      matrix:
        backend: [avf, proot]
        abi: [arm64-v8a, x86_64]
        include:
          - abi: arm64-v8a
            runner: ubuntu-24.04-arm
          - abi: x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and check native Debian image
        env:
          ABI: ${{ matrix.abi }}
          BACKEND: ${{ matrix.backend }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends podman e2fsprogs pigz
          python3 build-support/linux-images/build.py "$ABI" --backend "$BACKEND"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.backend }}-${{ matrix.abi }}
          path: build/linux-images/${{ matrix.abi }}/${{ matrix.backend }}/
          compression-level: 0
          if-no-files-found: error
          retention-days: 2
  linux:
    needs: image
    strategy:
      fail-fast: false
      matrix:
        plugin: [avf, proot]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.plugin }}-arm64-v8a
          path: build/linux-images/arm64-v8a/${{ matrix.plugin }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.plugin }}-x86_64
          path: build/linux-images/x86_64/${{ matrix.plugin }}
      - uses: ./.github/actions/build-plugin
        with:
          plugin: ${{ matrix.plugin }}
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
