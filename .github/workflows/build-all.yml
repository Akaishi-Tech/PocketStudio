name: Build all Pocket Studio plugins
on: workflow_dispatch
concurrency:
  group: signed-plugin-builds
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  plugins:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        plugin: [android, codex]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-plugin
        with:
          plugin: ${{ matrix.plugin }}
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
  image:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    strategy:
      fail-fast: false
      matrix:
        backend: [avf, proot]
        abi: [arm64-v8a, x86_64]
        include:
          - abi: arm64-v8a
            runner: ubuntu-24.04-arm
          - abi: x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and check native Debian image
        env:
          ABI: ${{ matrix.abi }}
          BACKEND: ${{ matrix.backend }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends podman e2fsprogs pigz
          python3 build-support/linux-images/build.py "$ABI" --backend "$BACKEND"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.backend }}-${{ matrix.abi }}
          path: build/linux-images/${{ matrix.abi }}/${{ matrix.backend }}/
          compression-level: 0
          if-no-files-found: error
          retention-days: 2
  linux:
    needs: image
    strategy:
      fail-fast: false
      matrix:
        plugin: [avf, proot]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.plugin }}-arm64-v8a
          path: build/linux-images/arm64-v8a/${{ matrix.plugin }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.plugin }}-x86_64
          path: build/linux-images/x86_64/${{ matrix.plugin }}
      - uses: ./.github/actions/build-plugin
        with:
          plugin: ${{ matrix.plugin }}
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Exercise PRoot on Android
        if: matrix.plugin == 'proot'
        timeout-minutes: 35
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo chmod a+rw /dev/kvm
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          "$tools/sdkmanager" "platform-tools" "emulator" "system-images;android-36;google_apis;x86_64"
          printf 'no\n' | "$tools/avdmanager" create avd --name linux-ci --package "system-images;android-36;google_apis;x86_64"
          "$ANDROID_HOME/emulator/emulator" -avd linux-ci -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -partition-size 12288 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'rc=$?; kill "$emulator_pid" 2>/dev/null || true; if [ "$rc" -ne 0 ]; then tail -60 "$RUNNER_TEMP/emulator.log"; fi' EXIT
          ./gradlew :linux-proot-plugin:assembleX86_64Debug :linux-proot-plugin:assembleX86_64DebugAndroidTest
          timeout 300 adb wait-for-device
          timeout 300 sh -c 'until adb shell getprop sys.boot_completed | grep -q 1; do sleep 3; done'
          adb install -r plugins/proot/build/outputs/apk/x86_64/debug/*.apk
          adb install -r plugins/proot/build/outputs/apk/androidTest/x86_64/debug/*.apk
          adb shell am instrument -w com.hcgstudio.pocketstudio.prootplugin.test/com.hcgstudio.pocketstudio.prootplugin.RuntimeSmoke | tee "$RUNNER_TEMP/smoke.log"
          grep -F "PASS PRoot toolchain" "$RUNNER_TEMP/smoke.log"
