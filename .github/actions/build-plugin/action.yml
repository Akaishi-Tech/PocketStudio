name: Build signed plugin
description: Package all supported ABIs using the project's signing identity
inputs:
  plugin:
    required: true
    description: Plugin directory name
runs:
  using: composite
  steps:
    - name: Prepare Android build tools
      shell: bash
      run: |
        echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
        echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
        "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"
        git submodule update --init --depth=1 --filter=blob:none -- upstream/release/tools/base
    - name: Build and sign
      shell: bash
      env:
        PLUGIN: ${{ inputs.plugin }}
      run: |
        umask 077
        export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/pocketstudio-release.keystore"
        trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
        printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
        unset ANDROID_KEYSTORE_BASE64
        python3 .github/scripts/build-plugin.py "$PLUGIN"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: plugin-${{ inputs.plugin }}
        path: build/plugin-artifacts/${{ inputs.plugin }}
        compression-level: 0
        if-no-files-found: error
        retention-days: 7
